server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ingestion-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/eventflow_ingestion}
    username: ${DATABASE_USERNAME:eventflow}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 20000
        request.timeout.ms: 10000
        max.request.size: 1048576
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  lifecycle:
    timeout-per-shutdown-phase: 30s

eventflow:
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-per-second: ${RATE_LIMIT_REFILL_PER_SECOND:10}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
  outbox:
    poll-interval: 250ms
    batch-size: 100
    lease-seconds: 30

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash
