name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Strict build, unit, integration and packaged application E2E tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Build and start demo
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
            target/bom.json
            compose.log
      - name: Stop demo
        if: always()
        run: docker compose down
