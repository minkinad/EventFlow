name: eventflow

x-service-defaults: &service-defaults
  restart: unless-stopped
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health/readiness >/dev/null"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 40s
  environment: &service-environment
    DATABASE_USERNAME: eventflow
    DATABASE_PASSWORD: eventflow
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    TRACING_SAMPLING_PROBABILITY: "1.0"
  networks: [eventflow]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [eventflow]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [eventflow]

  kafka:
    image: apache/kafka:3.9.1
    volumes: ["kafka-data:/var/lib/kafka/data"]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [eventflow]

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in eventflow.events.raw.v1 eventflow.events.delivery.v1 eventflow.events.processing-dlq.v1 eventflow.events.delivery-dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 6 --replication-factor 1
        done
    networks: [eventflow]

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_DB: eventflow
      CLICKHOUSE_USER: eventflow
      CLICKHOUSE_PASSWORD: eventflow
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [eventflow]

  ingestion-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args: {SERVICE: ingestion-service}
    environment:
      <<: *service-environment
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/eventflow_ingestion
      REDIS_HOST: redis
      RATE_LIMIT_FAIL_OPEN: "false"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  processing-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args: {SERVICE: processing-service}
    environment:
      <<: *service-environment
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/eventflow_processing
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  delivery-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args: {SERVICE: delivery-service}
    environment:
      <<: *service-environment
      SERVER_PORT: 8082
      DATABASE_URL: jdbc:postgresql://postgres:5432/eventflow_delivery
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USERNAME: eventflow
      CLICKHOUSE_PASSWORD: eventflow
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: eventflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      kafka: {condition: service_healthy}
    networks: [eventflow]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on: [jaeger]
    networks: [eventflow]

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
    networks: [eventflow]

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [eventflow]

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, jaeger]
    networks: [eventflow]

networks:
  eventflow:

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
